name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

permissions:
  contents: write   # necessario para publicar release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm deps
        working-directory: mobile
        run: npm ci

      - name: Capacitor sync
        working-directory: mobile
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: abrigoqr-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Publica como GitHub Release "latest" (URL publica fixa pra /install)
      - name: Publish APK as latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AbrigoQR - ultimo build (debug)"
          body: |
            APK debug gerado automaticamente do commit ${{ github.sha }}.

            Baixe e instale: [app-debug.apk](https://github.com/${{ github.repository }}/releases/download/latest/app-debug.apk)
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: "true"
